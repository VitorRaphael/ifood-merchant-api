# Configuração exclusiva para os testes automatizados — nunca usa credenciais reais
# nem toca no banco de dados de verdade (ifood_merchant.db).

spring.datasource.url=jdbc:sqlite:test_ifood_merchant.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.properties.hibernate.dialect=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update

ifood.client.id=teste
ifood.client.secret=teste
ifood.merchant.id=teste-merchant-id
