spring.application.name=ifood.merchant.api

# Conexão com o sqLite
spring.datasource.url=jdbc:sqlite:ifood_merchant.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.properties.hibernate.dialect=org.hibernate.community.dialect.SQLiteDialect

# Hibernate/JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Credenciais do iFood
ifood.client.id=${IFOOD_CLIENT_ID}
ifood.client.secret=${IFOOD_CLIENT_SECRET}
ifood.merchant.id=d102dcc7-4c89-48c1-8013-6edc36af90bb