spring.application.name=ifood.merchant.api

# App local: só aceita conexões da própria máquina, não expõe na rede Wi-Fi
server.address=127.0.0.1

# Conexão com o sqLite
spring.datasource.url=jdbc:sqlite:ifood_merchant.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.properties.hibernate.dialect=org.hibernate.community.dialect.SQLiteDialect

# Hibernate/JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Credenciais do iFood
ifood.client.id=${IFOOD_CLIENT_ID}
ifood.client.secret=${IFOOD_CLIENT_SECRET}
ifood.merchant.id=d102dcc7-4c89-48c1-8013-6edc36af90bb

# Enquanto ifood.client.id acima for o Client ID de TESTE (homologação), deixe
# true -- o iFood só devolve os dados fixos do ambiente de teste nas chamadas
# financeiras (Sales/Events/Reconciliation/Settlements/Antecipation) com esse
# header. Trocar para false quando o app passar a usar credenciais de produção.
ifood.financeiro.homologacao=true

# Login do próprio painel (usuário único, local) -- definido via variável de
# ambiente, nunca commitado, igual às credenciais do iFood acima.
app.login.usuario=${APP_LOGIN_USUARIO}
app.login.senha=${APP_LOGIN_SENHA}

# Arquivos estaticos (painel) sempre revalidados com o servidor antes de usar
# cache do navegador -- sem isso o navegador guarda app.js/styles.css por
# horas (heuristica de cache do proprio Chrome/Edge) e o cliente pode ficar
# vendo uma versao velha do painel depois de uma atualizacao do .exe.
spring.web.resources.cache.cachecontrol.no-cache=true
spring.web.resources.cache.cachecontrol.must-revalidate=true